      <rect x="642" y="328" width="96" height="44" rx="8" fill="#e6ebe8"/><text x="690" y="358" text-anchor="middle">edit</text>
      <rect x="750" y="328" width="96" height="44" rx="8" fill="#e6ebe8"/><text x="798" y="358" text-anchor="middle">bash</text>
      <rect x="858" y="328" width="96" height="44" rx="8" fill="#e6ebe8"/><text x="906" y="358" text-anchor="middle">grep</text>
      <rect x="966" y="328" width="100" height="44" rx="8" fill="#e6ebe8"/><text x="1016" y="358" text-anchor="middle">skill</text>
