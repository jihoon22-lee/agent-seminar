<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{title}}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5d6678; --line:#dfe3ea;
          --bar:#3b6fd4; --trend:#d9730d; --accent:#0f7b6c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d2129; --ink:#e8ebf0; --muted:#9aa3b2; --line:#323846;
            --bar:#6b97ec; --trend:#f0a14a; --accent:#4cc3ae; }
  }
  @media (max-width:700px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 20px 56px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi, section { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .kpi { padding:14px 16px; }
  .kpi .label { color:var(--muted); font-size:13px; }
  .kpi .value { font-size:20px; font-weight:700; margin-top:2px; white-space:nowrap; }
  .kpi .note { color:var(--muted); font-size:12px; }
  section { padding:18px 20px; margin-bottom:20px; }
  h2 { font-size:17px; margin:0 0 12px; }
  svg { width:100%; height:auto; display:block; }
  svg text { fill:var(--muted); font-size:12px; font-family:inherit; }
  svg .grid { stroke:var(--line); stroke-width:1; }
  svg .bar { fill:var(--bar); }
  svg .trend { fill:none; stroke:var(--trend); stroke-width:2.5; stroke-linejoin:round; }
  svg .dot { fill:var(--card); stroke:var(--trend); stroke-width:2; }
  svg .axis-left { fill:var(--bar); } svg .axis-right { fill:var(--trend); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tfoot td { font-weight:700; border-bottom:0; }
  .up { color:var(--accent); } .down { color:#c0392b; }
  footer { color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p class="sub">{{subtitle}}</p>
  <div class="kpis">
{{kpis}}
  </div>
  <section>
    <h2>월별 매출(막대)과 판매 수량(선)</h2>
{{chart}}
  </section>
  <section>
    <h2>지역별 요약</h2>
{{table}}
  </section>
  <footer>{{footer}}</footer>
</main>
</body>
</html>
